<html>
<head>

</head>
<body>
	 <div data-role="page" id="Main">

		<div data-role="content">

			<table  data-role="table" data-filter="true" data-input="#filterBasic-input" data-mode="none" class="ui-responsive table-stroke" >

				<thead>
        			<tr>
            			<th onclick="sortTable(0)">Tipo</th>

<div data-role="page" id="Log">
		<div data-role="header" data-position="fixed" data-id="global-header">
			<div data-role="navbar" >
				<ul>
					<li><a href="#Main" data-icon="home" >Home</a></li>
					<li><a href="#Log" data-icon="bullets" class="ui-btn-active">Log</a></li>
					<li><a href="#Fup" data-icon="gear">Setting</a></li>
				</ul>
			</div>
		</div>
		<div data-role="content">
			<table  data-role="table" data-filter="true" data-input="#filterBasic-input" data-mode="none" class="ui-responsive table-stroke" >

				</tbody>

	<div data-role="page" id="Fup"> 	<!-- FUP page -->
		<div data-role="header" data-position="fixed" data-id="global-header">
			<div data-role="navbar">
				<ul>
					<li><a href="#Main" data-icon="home" >Home</a></li>
					<li><a href="#Log" data-icon="bullets">Log</a></li>
					<li><a href="#Fup" data-icon="gear" class="ui-btn-active">Setting</a></li>
				</ul>
			</div>
		</div>
		<div data-role="content">
			<h2>Manutenzione</h2>
			 <form id="uploadFw" data-ajax="false">
    			<label for="fileInput1">Firmware upload</label>
    			<input type="file" accept=".bin" id="fileInput1" data-clear-btn="true">
    			<button id="uploadBtn">Upload</button>
			</form>
			 <form id="uploadConfig"  data-ajax="false" >
    			<label for="uploadConfigFile">Seleziona file config:</label>
    			<input type="file" name="uploadConfigFile" id="uploadConfigFile" accept=".conf" data-clear-btn="true" />
    			<button type="submit">Carica config</button>
			</form>
			<a href="/api/readConf" data-role="button"  data-inline="true" data-ajax="false" data-role="button">Scarica config</a>
		</div>
	</div>
	<div data-role="page" id="Disconnected"> <!-- disconnected page -->
		<div data-role="content" id="connStatus"></div>
		<a href="#" id="btnConnect" class="ui-btn ui-btn-b">Connect</a>
	</div>
	<div data-role="page" id="objDetails"> <!-- obj details -->
		<div data-role="header">
			<a href="#" data-rel="back" data-icon="arrow-l" data-iconpos="notext">Back</a>
    		<h1 id="objName" style="text-align:center;">My Page Title</h1>
		</div>
		<div role="main" class="ui-content">
			<table  data-role="table" data-mode="none" class="ui-responsive table-stroke" >
				<tbody id="propertyList">
			</tbody>
			</table >
		</div>
	</div>
<script>
	var wsocket;
	var ping;
	function sortTable(colIndex) {
    var table = document.querySelector("table tbody");
    var rows = Array.from(table.rows);

    rows.sort(function(a, b) {
        var A = a.cells[colIndex].innerText;
        var B = b.cells[colIndex].innerText;
        return A.localeCompare(B, undefined, {numeric: true});
    });

    rows.forEach(row => table.appendChild(row));

	function tableRoll(tableId,rows) {
    var numeroRighe = $("#" + tableId + " tr").length;

    if (numeroRighe > rows) {
        $("#" + tableId + " tr:first").remove();
    }
}
}
	function wsConnect()
	{
		wsocket = new WebSocket("ws://"+location.host,"ws");
		wsocket.addEventListener("close", function () {disconnected()})
		wsocket.addEventListener("error", function (error) {disconnected()})
		wsocket.addEventListener("open", function () {
			$.mobile.changePage("#Main");
			ping = window.setInterval(function(){
	 			sendRequest("ping");	
 				},5000);
			sendRequest("getObjectList","getObjectList");
		})
		wsocket.addEventListener("message", function (event) {
			var obj = JSON.parse(event.data);
			if (obj.id == "getObjectList") {
				handleObjectList(obj.data);
			}
			else if(obj.id == "getObjectTypes") {
			}
			else if(obj.id == "getObject") {
				$("#objName").html("["+obj.data.properties.type.value+"]"+obj.data.properties.name.value)
				$("#propertyList").empty();
				for (var prop in obj.data.properties) {
					if (Object.prototype.hasOwnProperty.call(obj.data.properties,prop)) {
						if (prop!="name" && prop!="type") {
							$("#propertyList").append(propertyContent(obj.data.id,prop,obj.data.properties[prop]));
						}
					}
				}
			}
			else if(obj.id == "propChange") {
				console.log("propChange",obj.id+"_"+obj.data.id, obj.data)
				$("body *").each(function() {
      				 $(this).trigger(obj.id+"_"+obj.data.id, obj.data);
    			 });
				 if (obj.data.id!="ledAlive_value")
				 {
					var now = new Date()
					$("#logList").append("<tr><td>"+now.getHours()+":"+now.getMinutes()+":"+now.getSeconds()+"</td><td>"+obj.data.id+"</td><td>"+obj.data.svalue+"</td></tr>");
					tableRoll("logList",128)
				 }
			}
			else if(obj.id == "ping") {
			}
			else if(obj.id == "sp") {
			}
		})
	}
	$(document).ready(function () {
		wsConnect();
	});
	$(document).on("pagebeforeshow", "#objDetails", function (event, ui) {
   		 var objectId = sessionStorage.getItem("objectId");
		 sendRequest("getObject","getObject",{objId:objectId});
	});
	$(document).on("pagecreate", "#Disconnected", function () {
  		$("#btnConnect").on("click", function () {
			$("#connStatus").html("Connecting");
    		wsConnect();
  		});
	});

	$("#uploadBtn").on("click", function(e) {
		e.preventDefault();
		let file = $("#fileInput1")[0].files[0];
		if (!file) {
			alert("Seleziona un file .bin");
			return;
		}

		$.ajax({
			url: "/api/update",
			type: "POST",
			data: file,
			processData: false,
			contentType: "application/octet-stream",
			success: function() {
				alert("Upload OK, l'ESP32 si riavvia");
			},
			error: function() {
				alert("Errore upload");
			}
		});
	});
	$(document).on("submit", "#uploadConfig", function (e) {
		e.preventDefault(); // blocca cambio pagina
		var file = $("#uploadConfigFile")[0].files[0];
    	if (!file) {
        	alert("Seleziona un file");
        	return;
    	}
		$.ajax({
			url: "/api/writeConf",
			type: "POST",
			data: file,
			processData: false, 
			contentType: "application/octet-stream",
			headers: {
            	"X-Filename": file.name
        	},
			success: function (response) {
				alert("upload OK");
			},
			error: function () {
				alert("upload ERROR");
			}
		});
	});
	function sendRequest(_id, _cmd, _data=null) {
	console.log(JSON.stringify({id:_id,cmd:_cmd,data:_data}))
		wsocket.send(JSON.stringify({id:_id,cmd:_cmd,data:_data}))
	}
	function propertyContent(id,prop,data) {
		 var Jrow = $("<TR>")
		 Jrow.append($("<td>").html(prop))
		 var jValue;
		switch (data.type) {
			case 0:
				jValue = $("<input type='checkbox' />");
				if (data.value  == true)
				{
				jValue.attr("checked",true);
				}
				break;
			case 1:
				jValue = $("<input type='number' placeholder='"+data.svalue+"' />");
			break;
			case 2:
				jValue = $("<input type='number' value='"+data.value+"' />");
				break;
			case 3:
				jValue = $("<input type='text' value='"+data.value+"' />");
				break;
			case 4:
				jValue = $("<select/>");
				$.each(data.options, function(val, text) {
					jOption = $('<option></option>').val(val).html(text)
					if (val == data.value)
			 		{
						jOption.attr("selected",true);
			 		}
					jValue.append( jOption)
				});
				break;
		}
		Jrow.append($("<TD>").append(jValue))
		var Jicons=($("<TD style='position:relative; text-align:center;'>"))
 	    if (data.rw) {
			Jicons.append(" <span class='ui-icon ui-icon-edit ui-btn-icon-notext'></span>")
		}
		else {
			//jValue.attr('readonly', true);
    		jValue.prop("disabled", true)
		}
		Jrow.append(Jicons)
		jValue.on("propChange_"+id+"_"+prop, function(event, _data) {
			if($(this).attr("placeholder")) {
				$(this).attr('placeholder',_data.svalue);
			}
			else if ($(this).val !==undefined) { 
	   			$(this).val(_data.svalue);
	   		}
			if ($(this).text !==undefined) {
				$(this).text(_data.svalue);
			}
			if ($(this).attr("type") =="checkbox") {
				if (_data.value) {
						$(this).prop( "checked", true );
				}
				else {
						$(this).prop( "checked", false );
				}
			}
		});
		jValue.change(function(){
			var val;
			if ($( this ).attr('type')=='checkbox') {
				if ($( this ).is(':checked')) {
					val = "true"
				}
				else {
					val = "false"
				}
			}
			else {
				val = $( this ).val()
			}
			sendRequest("sp","setProperty",{objId:id,propId:prop,value:val});
		});
		return Jrow
	}
	function handleObjectList(_data)
	{
		$("#mainList").empty();
		$.each(_data,function(index,value) {
			var jTr = $("<tr>")
			jTr.append($("<td>").html(value.type))
			var jName = ($("<td>").html(value.name))	
			jName.click(function(){
				sessionStorage.setItem("objectId",value.id)
				$.mobile.changePage("#objDetails");
			});
			jTr.append(jName)
			var jIcons = $("<td style='position:relative; text-align:center;'>");
			var JiconFail = $("<span class='ui-icon ui-icon-alert ui-btn-icon-notext'></span>");
			if (value.fail!="yes") JiconFail.hide();
			JiconFail.on("propChange_"+value.id+"_fail", function(event, data) {
			if (data.value)
				$(this).show();
			else
				$(this).hide();
			});	
			var JiconOverride = $("<span class='ui-icon ui-icon-lock ui-btn-icon-notext'></span>");
			if (value.override!="yes") JiconOverride.hide();
			JiconOverride.on("propChange_"+value.id+"_override", function(event, data) {
			if (data.value)
				$(this).show();
			else
				$(this).hide();
			});	
			jIcons.append(JiconFail);
			jIcons.append(JiconOverride);
			
			jValue = $("<td>").html(value.svalue)
			jValue.on("propChange_"+value.id+"_value", function(event, data) {
				 $(this).text(data.svalue);
			});
			jTr.append(jValue);
			jTr.append(jIcons);
			$("#mainList").append(jTr);
		})
	}
	function disconnected()
	{
		$("#connStatus").html("Disconnected");
		$.mobile.changePage("#Disconnected");
		clearTimeout(ping);
	}
</script>
</body>
</html>
